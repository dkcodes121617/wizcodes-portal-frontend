name: CI

# main only, exactly as requested.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The build inlines NEXT_PUBLIC_* values, so one must exist for the build
      # to succeed. The real value lives in Vercel's project settings; this is
      # only here so CI can compile.
      NEXT_PUBLIC_API_URL: https://ci.invalid

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align npm version with local dev
        run: npm install -g npm@11.6.2

      - name: Verify package-lock.json (npm 10, matches Vercel)
        run: npm run lockfile:check

      - name: Install dependencies
        run: npm ci

      - name: Prettier (format check)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build
